<nav class="my-4" aria-label="Пагінація списку">
  <p class="visually-hidden" role="status">
    Сторінка {{ pageNumber }}. На сторінці: {{ itemCount }} · До 25 записів
  </p>
  <ul class="pagination flex-wrap mb-0">
    <li class="page-item" [class.disabled]="disabled || !hasPrevious">
      <button
        class="page-link"
        type="button"
        [disabled]="disabled || !hasPrevious"
        aria-label="Попередня сторінка"
        title="Попередня сторінка"
        (click)="previousPage.emit()"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M10 3 5 8l5 5" />
        </svg>
      </button>
    </li>
    @for (link of pageLinks; track link.key) {
      <li
        class="page-item"
        [class.active]="link.number === pageNumber"
        [class.pagination-gap]="link.number === null"
        [attr.aria-hidden]="link.number === null ? 'true' : null"
      >
        @if (link.number === null) {
          <span class="page-link">…</span>
        } @else {
          <button
            class="page-link"
            type="button"
            [disabled]="disabled"
            [attr.aria-label]="'Сторінка ' + link.number"
            [attr.aria-current]="link.number === pageNumber ? 'page' : null"
            (click)="selectPage(link.number)"
          >
            {{ link.number }}
          </button>
        }
      </li>
    }
    <li class="page-item" [class.disabled]="disabled || !hasNext">
      <button
        class="page-link"
        type="button"
        [disabled]="disabled || !hasNext"
        aria-label="Наступна сторінка"
        title="Наступна сторінка"
        (click)="nextPage.emit()"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="m6 3 5 5-5 5" />
        </svg>
      </button>
    </li>
  </ul>
</nav>
