<nav
  class="d-flex flex-wrap justify-content-between align-items-center gap-3 my-4"
  aria-label="Пагінація списку"
>
  <p class="small text-body-secondary mb-0" role="status">
    На сторінці: {{ itemCount }} · До 25 записів
  </p>
  <ul class="pagination flex-wrap mb-0">
    <li class="page-item" [class.disabled]="disabled || !hasPrevious">
      <button
        class="page-link"
        type="button"
        [disabled]="disabled || !hasPrevious"
        aria-label="Попередня сторінка"
        title="Попередня сторінка"
        (click)="previousPage.emit()"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M10 3 5 8l5 5" />
        </svg>
      </button>
    </li>
    <li class="page-item active">
      <span class="page-link" aria-current="page">Сторінка {{ pageNumber }}</span>
    </li>
    <li class="page-item" [class.disabled]="disabled || !hasNext">
      <button
        class="page-link"
        type="button"
        [disabled]="disabled || !hasNext"
        aria-label="Наступна сторінка"
        title="Наступна сторінка"
        (click)="nextPage.emit()"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="m6 3 5 5-5 5" />
        </svg>
      </button>
    </li>
  </ul>
</nav>
