@if (error) {
  <div class="alert alert-danger" role="alert">{{ error }}</div>
}
@if (notice) {
  <div class="alert alert-success" role="status">{{ notice }}</div>
}
<div class="d-flex flex-wrap justify-content-end gap-2 mb-3">
  <button class="btn btn-outline-secondary" (click)="exportExcel()" [disabled]="loading || saving">
    Експортувати в Excel
  </button>
  <button class="btn btn-outline-secondary" (click)="load()" [disabled]="loading || saving">
    ↻ Оновити
  </button>
</div>
<app-residents
  [view]="lists.residentView"
  [pendingCount]="pendingCount"
  [permissions]="me.effectivePermissions"
  [registeredResidents]="lists.registeredResidents"
  [filters]="lists.residentDirectory.filters"
  [pendingBuilding]="lists.pendingDirectory.building"
  (pendingBuildingChange)="applyPendingBuilding($event)"
  (filtersChange)="applyResidentFilters($event)"
  (viewChange)="switchResidentView($event)"
  [residents]="lists.residents"
  [loading]="loading"
  [saving]="saving"
  (approve)="decide($event, true)"
  (reject)="rejecting = $event"
/>
@if (loading) {
  <p class="text-body-secondary py-3" role="status">Завантажуємо…</p>
}
<app-pagination
  [pageNumber]="lists.pagination.index + 1"
  [availablePages]="lists.availablePages()"
  [itemCount]="lists.itemCount()"
  [hasPrevious]="lists.pagination.index > 0"
  [hasNext]="lists.hasNext()"
  [disabled]="loading || saving"
  (pageSelected)="goToPage($event)"
  (previousPage)="previousPage()"
  (nextPage)="nextPage()"
/>
@if (rejecting; as registration) {
  <app-registration-rejection-dialog
    [registration]="registration"
    [saving]="saving"
    [error]="error"
    (rejected)="decide(registration, false, $event)"
    (closed)="closeDialog()"
  />
}
