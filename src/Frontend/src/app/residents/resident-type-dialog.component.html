<div class="modal-backdrop fade show"></div>
<div
  class="modal d-block"
  role="dialog"
  aria-modal="true"
  tabindex="-1"
  aria-labelledby="resident-type-title"
  (keydown.escape)="!saving && closed.emit()"
>
  <div class="modal-dialog modal-dialog-centered">
    <section class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="resident-type-title">Редагувати дані</h2>
        <button
          type="button"
          class="btn-close"
          aria-label="Закрити"
          [disabled]="saving"
          (click)="closed.emit()"
        ></button>
      </div>
      <form class="modal-body" (ngSubmit)="save()">
        <div class="mb-3">
          <label class="form-label" for="resident-first-name">Ім’я</label>
          <input
            id="resident-first-name"
            class="form-control"
            name="firstName"
            [(ngModel)]="firstName"
            maxlength="80"
            required
            [disabled]="saving"
          />
        </div>
        <div class="mb-3">
          <label class="form-label" for="resident-last-name">Прізвище</label>
          <input
            id="resident-last-name"
            class="form-control"
            name="lastName"
            [(ngModel)]="lastName"
            maxlength="80"
            required
            [disabled]="saving"
          />
        </div>
        @if (error) {
          <p class="alert alert-danger" role="alert">{{ error }}</p>
        }
        <p class="form-text">
          Ім’я та прізвище мають містити літери; також дозволені пробіли, дефіси й апострофи.
        </p>
        <label class="form-label" for="change-resident-type">Тип мешканця</label>
        <ng-select
          labelForId="change-resident-type"
          name="type"
          [(ngModel)]="type"
          [clearable]="false"
          [searchable]="false"
          [disabled]="saving"
        >
          <ng-option value="Owner">Власник</ng-option
          ><ng-option value="FamilyMember">Член родини</ng-option
          ><ng-option value="Tenant">Орендар</ng-option
          ><ng-option value="Employee">Працівник ОСББ</ng-option>
        </ng-select>
        <p class="form-text">Зміна даних не змінює стан реєстрації.</p>
        <div class="d-flex justify-content-end gap-2 mt-3">
          <button
            type="button"
            class="btn btn-outline-secondary"
            [disabled]="saving"
            (click)="closed.emit()"
          >
            Скасувати</button
          ><button type="submit" class="btn btn-primary" [disabled]="saving || !valid">
            Зберегти
          </button>
        </div>
      </form>
    </section>
  </div>
</div>
