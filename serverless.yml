service: osbb-requests
frameworkVersion: '4'
configValidationMode: error
stages:
  default:
    params:
      frontendRedirectHost: zeleniy-ostriv2.com
provider:
  name: aws
  region: ${opt:region, 'eu-central-1'}
  stage: ${opt:stage, 'dev'}
resources:
  Resources:
    AdminUserPool:
      Type: AWS::Cognito::UserPool
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        UserPoolName: ${self:service}-${sls:stage}-admins
        UsernameAttributes:
        - email
        UsernameConfiguration:
          CaseSensitive: false
        AutoVerifiedAttributes:
        - email
        Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false
        Policies:
          PasswordPolicy:
            MinimumLength: 12
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false
        AccountRecoverySetting:
          RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
    AdminUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:service}-${sls:stage}-admin-web
        UserPoolId:
          Ref: AdminUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        PreventUserExistenceErrors: ENABLED
        EnableTokenRevocation: true
        AccessTokenValidity: 15
        IdTokenValidity: 15
        RefreshTokenValidity: 7
        TokenValidityUnits:
          AccessToken: minutes
          IdToken: minutes
          RefreshToken: days
        SupportedIdentityProviders:
        - COGNITO
    FrontendRouter:
      Type: AWS::CloudFront::Function
      Properties:
        Name: ${self:service}-${sls:stage}-frontend-router
        AutoPublish: true
        FunctionConfig:
          Comment: Redirect the legacy frontend host to the local installation
          Runtime: cloudfront-js-2.0
        FunctionCode: |
          function handler(event) {
            var request = event.request;
            var path = request.uri === '/index.html' ? '/' : request.uri;
            return {
              statusCode: 302,
              statusDescription: 'Found',
              headers: {
                location: { value: 'https://${param:frontendRedirectHost}' + path },
                'cache-control': { value: 'no-store' }
              }
            };
          }
    FrontendDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          HttpVersion: http2
          PriceClass: PriceClass_100
          Origins:
          # CloudFront requires an origin. The viewer-request function returns the redirect.
          - Id: frontend
            DomainName: '${param:frontendRedirectHost}'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
          DefaultCacheBehavior:
            TargetOriginId: frontend
            FunctionAssociations:
            - EventType: viewer-request
              FunctionARN:
                Fn::GetAtt:
                - FrontendRouter
                - FunctionARN
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
            - GET
            - HEAD
            CachedMethods:
            - GET
            - HEAD
            Compress: true
            MinTTL: 0
            DefaultTTL: 300
            MaxTTL: 31536000
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
          ViewerCertificate:
            CloudFrontDefaultCertificate: true
  Outputs:
    UserPoolId:
      Value:
        Ref: AdminUserPool
    UserPoolClientId:
      Value:
        Ref: AdminUserPoolClient
    FrontendDistributionId:
      Value:
        Ref: FrontendDistribution
    FrontendUrl:
      Value:
        Fn::Join:
        - ''
        - - https://
          - Fn::GetAtt:
            - FrontendDistribution
            - DomainName
