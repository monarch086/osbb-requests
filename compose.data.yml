services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OSBB_IMPORT_DATABASE:?Set OSBB_IMPORT_DATABASE}
      POSTGRES_USER: ${OSBB_POSTGRES_USER:-osbb}
      POSTGRES_PASSWORD: ${OSBB_POSTGRES_PASSWORD:?Set OSBB_POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${OSBB_POSTGRES_PORT:-5433}:5432'
    volumes:
      - osbb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
  adminer:
    image: adminer:5.5.1
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - '${OSBB_ADMINER_BIND:-127.0.0.1}:${OSBB_ADMINER_PORT:-8081}:8080'
    depends_on:
      postgres:
        condition: service_healthy
  importer:
    image: osbb-requests-importer:local
    build:
      context: .
      dockerfile: src/OsbbRequests.DataImport/Dockerfile
    profiles: [tools]
    command: [import, --stage, dev, --region, eu-central-1]
    user: '${OSBB_IMPORTER_UID:-1000}:${OSBB_IMPORTER_GID:-1000}'
    environment:
      HOME: /app
      AWS_PROFILE: ${AWS_PROFILE:-default}
      OSBB_IMPORT_CONNECTION_STRING: ${OSBB_IMPORT_DOCKER_CONNECTION_STRING:?Set OSBB_IMPORT_DOCKER_CONNECTION_STRING}
    volumes:
      - type: bind
        source: ${OSBB_AWS_DIRECTORY:-${HOME}/.aws}
        target: /app/.aws
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
  web-api:
    image: osbb-requests-web-api:local
    build:
      context: .
      dockerfile: src/OsbbRequests.WebApi/Dockerfile
    profiles: [web-api]
    environment:
      ASPNETCORE_HTTP_PORTS: '8080'
      Cognito__UserPoolId: ${OSBB_COGNITO_USER_POOL_ID:-}
      Cognito__ClientId: ${OSBB_COGNITO_CLIENT_ID:-}
      ConnectionStrings__Postgres: ${OSBB_WEB_API_CONNECTION_STRING:?Set OSBB_WEB_API_CONNECTION_STRING}
      Postgres__ComplexId: ${OSBB_COMPLEX_ID:-osbb-requests-dev}
      Postgres__AccountId: ${OSBB_SOURCE_ACCOUNT_ID:-}
    ports:
      - '127.0.0.1:${OSBB_WEB_API_PORT:-8082}:8080'
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    image: osbb-requests-frontend:local
    build:
      context: src/Frontend
    profiles: [web-api]
    environment:
      NGINX_ENVSUBST_FILTER: ^OSBB_COGNITO_
      OSBB_COGNITO_USER_POOL_ID: ${OSBB_COGNITO_USER_POOL_ID:-}
      OSBB_COGNITO_CLIENT_ID: ${OSBB_COGNITO_CLIENT_ID:-}
    ports:
      - '${OSBB_FRONTEND_BIND:-127.0.0.1}:${OSBB_FRONTEND_PORT:-8083}:8080'
    depends_on:
      - web-api
volumes:
  osbb_postgres_data:
